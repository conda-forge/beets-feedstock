# -*- mode: toml -*-
# This file was generated automatically from conda-smithy. To update this configuration,
# update the conda-forge.yml and/or the recipe/meta.yaml.
"$schema" = "https://pixi.sh/v0.59.0/schema/manifest/schema.json"

[workspace]
name = "beets-feedstock"
version = "2026.9.1"  # conda-smithy version used to generate this file
description = "Pixi configuration for conda-forge/beets-feedstock"
authors = ["@conda-forge/beets"]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]
requires-pixi = ">=0.59.0"

[tasks.build-locally]
cmd = "pixi exec --force-reinstall --list='^python$' python ./build-locally.py"
description = "Build packages locally using the same setup scripts used in conda-forge's CI"
[tasks.smithy]
cmd = "pixi exec --force-reinstall --list='^conda-smithy$' conda-smithy"
description = "Run conda-smithy. Pass necessary arguments."
[tasks.rerender]
cmd = "pixi exec --force-reinstall --list='^conda-smithy$' conda-smithy rerender"
description = "Rerender the feedstock."

[tasks.lint]
cmd = "pixi exec --list='^conda-smithy$' conda-smithy lint --conda-forge recipe"
description = "Lint the feedstock recipe"

[feature.build.dependencies]
conda-build = ">=26.3"
conda-forge-ci-setup = "4.*"
rattler-build = "*"

[feature.build.tasks.inspect-all]
cmd = "inspect_artifacts --all-packages"
description = "List contents of all packages found in rattler-build build directory."
[feature.build.tasks.build]
cmd = "rattler-build build --recipe recipe"
description = "Build beets-feedstock directly (without setup scripts), no particular variant specified"
[feature.build.tasks."build-linux_64_numpy_min2.0.2python_max3.13python_min3.10"]
cmd = "rattler-build build --recipe recipe -m .ci_support/linux_64_numpy_min2.0.2python_max3.13python_min3.10.yaml "
description = "Build beets-feedstock with variant linux_64_numpy_min2.0.2python_max3.13python_min3.10 directly (without setup scripts)"
[feature.build.tasks."debug-linux_64_numpy_min2.0.2python_max3.13python_min3.10"]
cmd = "rattler-build debug setup --recipe recipe -m .ci_support/linux_64_numpy_min2.0.2python_max3.13python_min3.10.yaml "
description = "Debug beets-feedstock with variant linux_64_numpy_min2.0.2python_max3.13python_min3.10 directly (without setup scripts)"
[feature.build.tasks."inspect-linux_64_numpy_min2.0.2python_max3.13python_min3.10"]
cmd = "inspect_artifacts --recipe-dir recipe -m .ci_support/linux_64_numpy_min2.0.2python_max3.13python_min3.10.yaml"
description = "List contents of beets-feedstock packages built for variant linux_64_numpy_min2.0.2python_max3.13python_min3.10"
[feature.build.tasks."build-linux_64_numpy_min2.3.5python_max3.15python_min3.13"]
cmd = "rattler-build build --recipe recipe -m .ci_support/linux_64_numpy_min2.3.5python_max3.15python_min3.13.yaml "
