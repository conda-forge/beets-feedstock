schema_version: 1

context:
  name: beets
  version: "2.14.1"
  build_number: 0

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/beets-${{ version }}.tar.gz
  sha256: b25dc7bf8ed093d8b6e043e88013736902c1082c958b81a598af5db5275539a5

build:
  number: ${{ build_number }}
  string: python_min${{ python_min }}_pyh${{ hash }}_${{ build_number }}
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - beet = beets.ui:main

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }},<${{ python_max }}
    - colorama
    - confuse >=2.2.0
    - jellyfish
    - lap >=0.5.12
    - mediafile >=0.17.0
    - numpy >=${{ numpy_min }}
    - packaging >=24.0
    - platformdirs >=3.5.0
    - pyyaml
    - requests >=2.32.5
    - requests-ratelimiter >=0.7.0
    - typing_extensions
    - unidecode >=1.3.6
    #- scipy >=${{ scipy_min }}
    #- numba >=${{ numba_min }}
  run_constraints:
    # Extra: plexupdate
    - requests  #
    # Extra: embedart
    - Pillow  #
    # Extra: web
    - flask
    - flask_cors  #
    # Extra: autobpm
    - librosa >=0.11
    - resampy >=0.4.3
    - numba >=0.65.1  #
    # Extra: tidal
    - requests-oauthlib >=0.6.1  #
    # Extra: replaygain
    - PyGObject
    # Extra: chroma
    - pyacoustid >=1.3.1,<2  #
    # Extra: discogs
    - python3-discogs-client >=2.3.15  #
    # Extra: lyrics
    - beautifulsoup4
    - langdetect  #
    # Extra: import
    - py7zr
    - rarfile  #
    # Extra: lastimport
    - pylast  #
    # Extra: metasync
    - dbus-python
    # Extra: mpdstats
    - python-mpd2 >=0.4.2  #
    # Extra: reflink
    - reflink  #
    # Extra: scrub
    - mutagen >=1.33  #
    # Extra: sonosupdate
    - soco  #
    # Extra: thumbnails
    - pyxdg  #
    # Extra: titlecase
    - titlecase

tests:
  - python:
      imports:
        - beets
        - beetsplug
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - pip check
      - beet --help

about:
  summary: music tagger and library organizer
  license: MIT
  license_file: LICENSE
  description: |
    Beets is the media library management system for obsessive music geeks.
    The purpose of beets is to get your music collection right once and for all.
    It catalogs your collection, automatically improving its metadata as it goes.
    It then provides a bouquet of tools for manipulating and accessing your music.


  homepage: https://beets.io/
  repository: https://github.com/beetbox/beets
  documentation: https://beets.readthedocs.io/

extra:
  recipe-maintainers:
    - HeavyTony2
